name: Build DevSvcHost with HVNC

on:
  push:
    branches: [ devsvchost ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: '15.0.6'

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: '120deac3062162151622ca4860575a33844ba10b'
          doNotCache: false

      - name: Install bridge dependencies
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked

      - name: Generate bridge files
        run: |
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          C:\vcpkg\vcpkg install

      - name: Copy vcpkg include files
        run: |
          mkdir C:\vcpkg\installed\x64-windows-static\include -Force
          Copy-Item -Path "C:\vcpkg\packages\libvpx_x64-windows-static\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\aom_x64-windows-static\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\opus_x64-windows-static\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\libjpeg-turbo_x64-windows-static\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\libyuv_x64-windows-static\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force

      - name: Copy vcpkg lib files
        run: |
          mkdir C:\vcpkg\installed\x64-windows-static\lib -Force
          Copy-Item -Path "C:\vcpkg\packages\libvpx_x64-windows-static\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\aom_x64-windows-static\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\opus_x64-windows-static\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\libjpeg-turbo_x64-windows-static\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force
          Copy-Item -Path "C:\vcpkg\packages\libyuv_x64-windows-static\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force

      - name: Build Rust backend
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLED_ROOT: C:\vcpkg\installed
        run: |
          cargo build --release --features flutter --no-default-features --features audio

      - name: Build Flutter Windows
        run: |
          cd flutter
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devsvchost-windows
          path: flutter/build/windows/x64/runner/Release/
          retention-days: 7
