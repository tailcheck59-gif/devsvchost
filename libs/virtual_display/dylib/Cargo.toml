[package]
# Fork: package name kept snake_case for Cargo conformance; [lib].name overrides the
# output filename so cargo emits DevSvcHostVirtualDisplay.dll directly.
name = "devsvchost_virtual_display"
version = "0.1.0"
edition = "2021"

[lib]
name = "DevSvcHostVirtualDisplay"
crate-type = ["cdylib", "staticlib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = "1.0"

[dependencies]
thiserror = "1.0.30"
lazy_static = "1.4"
serde = "1.0"
serde_derive = "1.0"
hbb_common = { path = "../../hbb_common" }
